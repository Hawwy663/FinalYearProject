<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>管理員後台 - 總覽</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid lightgray; padding-bottom: 15px; margin-bottom: 30px; }
        .stats-container { display: flex; justify-content: space-between; margin-bottom: 40px; gap: 20px; }
        .stat-box { flex: 1; padding: 30px 20px; text-align: center; font-size: 18px; border: 1px solid lightgray; background-color: whitesmoke; }
        .stat-box b { font-size: 28px; color: dodgerblue; display: block; margin-top: 10px; }
        .section-title { padding: 10px 0; margin-bottom: 15px; font-weight: bold; font-size: 20px; border-bottom: 2px solid lightgray; }
    </style>
</head>
<body>
<div class="container">
    <div class="dashboard-header">
        <h2 style="border: none; margin: 0; padding: 0; font-size: 28px;">後樓梯消防巡查管理系統</h2>
        <div style="font-size: 24px;">管理員</div><!--預計有相片-->
    </div>

    <div class="stats-container">
        <div class="stat-box">今日上傳<b id="count-upload">0</b></div>
        <div class="stat-box">AI 發現違規<b id="count-violation" style="color: crimson;">0</b></div>
        <div class="stat-box">待處理<b id="count-pending" style="color: darkorange;">0</b></div>
    </div>

    <div class="section-title">AI 偵測到的違規紀錄</div>
    <table>
        <thead>
            <tr><th>樓層位置</th><th>AI 判定</th><th>處理狀態</th><th>上傳時間</th><th>操作</th></tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5">載入資料中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    window.onload = function() {
        fetch('get_inspections.php')
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // 今日日期字串（YYYY-MM-DD），用來篩「今日上傳」
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const todayCount = data.filter(item => (item['時間'] || '').startsWith(todayStr)).length;

            let total = data.length;
            let violations = 0;
            let pending = 0;

            if (total === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>目前無巡查資料</td></tr>";
                return;
            }

            // 篩選出有發現雜物的紀錄 (AI是否發現雜物為 true)
            const violationList = data.filter(item => item['AI是否發現雜物'] === true);
            violations = violationList.length;
            pending = violationList.filter(item => item['狀態'] === '待處理').length;

            // 更新頂部統計數字
            document.getElementById('count-upload').innerText = todayCount + "份";
            document.getElementById('count-violation').innerText = violations + "宗";
            document.getElementById('count-pending').innerText = pending + "宗";

            // 只顯示有違規的資料
            if (violations === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='color:green;'>太棒了！目前沒有發現任何違規。</td></tr>";
                return;
            }

            violationList.forEach(item => {
                let statusColor = item['狀態'] === "待處理" ? "crimson" : "yellowgreen";
                
                let row = `
                    <tr>
                        <td><b>${item['樓層']} 後樓梯</b></td>
                        <td style="color: crimson;">發現雜物</td>
                        <td style="color: ${statusColor}; font-weight:bold;">${item['狀態']}</td>
                        <td>${item['時間']}</td>
                        <!-- 點擊傳遞該筆紀錄的 ID 給下一頁 -->
                        <td><button class="btn-cyan" onclick="window.location.href='record_detail.html?id=${item['巡查ID']}'">查看詳情</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('tableBody').innerHTML = "<tr><td colspan='5' style='color:red;'>系統載入失敗，請檢查資料庫連線。</td></tr>";
        });
    };
</script>
</body>
</html>
