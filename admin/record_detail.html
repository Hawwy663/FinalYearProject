<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>違規記錄詳情</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .header-bar { display: flex; align-items: center; margin-bottom: 30px; border-bottom: 2px solid lightgray; padding-bottom: 15px; }
        .back-btn { font-size: 30px; cursor: pointer; margin-right: 20px; color: dodgerblue;}
        
        .detail-layout { display: flex; gap: 40px; }
        .photo-section { width: 50%; }
        .photo-title { padding: 10px; font-weight: bold; border: 1px solid sandybrown; color: sandybrown; border-bottom: none; }
        .photo-box { height: 400px; border: 1px solid lightgray; background-color: whitesmoke; overflow: hidden; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-section { width: 50%; }
        .info-row { padding: 20px; margin-bottom: 20px; border: 1px solid lightgray; font-size: 18px; background-color: whitesmoke;}
        .action-btns { display: flex; justify-content: space-between; margin-top: 40px; }
        .action-btns button { font-size: 18px; padding: 15px 40px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <div class="back-btn" onclick="window.location.href='admin.html'">⬅</div>
        <h2 id="page-title" style="flex: 1; margin: 0; border: none; padding: 0;">載入中...</h2>
    </div>

    <div class="detail-layout">
        <div class="photo-section">
            <div class="photo-title">AI 偵測違規照片</div>
            <div class="photo-box">
                <img id="detail-img" src="" alt="載入中...">
            </div>
        </div>
        
        <div class="info-section">
            <div class="info-row" id="info-time">上傳時間：載入中</div>
            <div class="info-row" id="info-status">處理狀態：載入中</div>
            <div style="margin-top: 30px;">
                <div style="padding: 10px 0; font-weight: bold; font-size: 18px;">更新處理狀態：</div>
                <label style="margin-right: 20px; font-size: 16px;"><input type="radio" name="status" value="待處理" checked> 待處理</label>
                <label style="margin-right: 20px; font-size: 16px;"><input type="radio" name="status" value="已通知"> 已通知</label>
                <label style="font-size: 16px;"><input type="radio" name="status" value="已結案"> 已結案</label>
            </div>
        </div>
    </div>

    <div class="action-btns">
        <!-- 預計功能：將選擇的狀態寫回資料庫  -->
        <button onclick="alert('狀態已更新！(樣本展示)')">更新狀態</button>
        <!-- 預計功能：跳轉至列印通知頁面 -->
        <button class="btn-cyan" onclick="window.location.href='print_notice.html'">生成紙本報告</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const inspectionId = urlParams.get('id');

    if(inspectionId) {
        // 預計功能：直接發送請求拿取全部資料，並在前端篩選
        fetch('get_inspections.php')
        .then(res => res.json())
        .then(data => {
            const record = data.find(item => item['巡查ID'] === inspectionId);
            if(record) {
                document.getElementById('page-title').innerText = `${record['樓層']} 後樓梯 - 違規詳情`;
                document.getElementById('detail-img').src = record['照片'];
                document.getElementById('info-time').innerText = `上傳時間：${record['時間']}`;
                document.getElementById('info-status').innerText = `處理狀態：${record['狀態']}`;
            } else {
                alert("找不到該筆資料");
                window.location.href = 'admin.html';
            }
        });
    } else {
        alert("缺少參數");
        window.location.href = 'admin.html';
    }
</script>
</body>
</html>
