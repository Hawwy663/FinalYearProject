<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳結果</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .result-box { margin-bottom: 20px; }
        .box-title { padding: 10px; font-weight: bold; text-align: center; border: 1px solid gray; border-bottom: none;}
        .success-title { color: green; }
        .fail-title { color: red; }
        .box-content { padding: 40px 20px; text-align: center; font-size: 20px; border: 1px solid gray; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container mobile-container">
    
    <!-- 成功狀態 -->
    <div id="success-view" class="result-box hidden">
        <div class="box-title success-title">成功結果</div>
        <div class="box-content">
            記錄已上傳
        </div>
    </div>

    <!-- 失敗狀態 -->
    <div id="fail-view" class="result-box hidden">
        <div class="box-title fail-title">失敗結果</div>
        <div class="box-content">
            <p style="margin-bottom: 20px;">記錄上傳失敗,請重新嘗試</p>
            <button onclick="window.location.href='index.html'">重新嘗試</button>
        </div>
    </div>

    <!-- 返回首頁按鈕 -->
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="window.location.href='index.html'" class="btn-cyan" style="width: 100%;">返回首頁</button>
    </div>
</div>

<script>
    // 判斷要顯示成功還是失敗
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status');

    if (status === 'success') {
        document.getElementById('success-view').classList.remove('hidden');
    } else {
        document.getElementById('fail-view').classList.remove('hidden');
    }
</script>
</body>
</html>
